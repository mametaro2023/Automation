name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore AutomationTool.csproj

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/publish.ps1 -Runtime win-x64 -Configuration Release -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notesPath = ".github/release-notes/${{ github.ref_name }}.md"
          $args = @(
            "release", "create", "${{ github.ref_name }}",
            "dist/AutomationTool-$version-win-x64.zip#AutomationTool-${{ github.ref_name }}-win-x64.zip"
          )
          if (Test-Path $notesPath) {
            $args += @("--notes-file", $notesPath)
          } else {
            $args += "--generate-notes"
          }

          gh @args
